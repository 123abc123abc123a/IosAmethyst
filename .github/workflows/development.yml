name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
    
    runs-on: macos-14
    steps:
      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "sha=$(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@v4
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        uses: actions/checkout@v4
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        run: |
          cd gl4es
          
          # Forcefully strip the Linux-only linker flag from the CMake configuration
          find . -type f -name "CMakeLists.txt" -exec sed -i.bak 's/-Wl,-Bsymbolic//g' {} +
          
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          
          # Added flags to bypass CMake's strict compiler tests and fix Xcode 15 errors
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DENABLE_BITCODE=OFF \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          
          # Guarantee the destination folder exists before attempting to copy
          mkdir -p ../Natives/resources/Frameworks/
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib
          
      - name: Push gl4es
        if: false
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Build for ${{ matrix.platform_name }}
        run: |
          brew install make ldid dpkg jq
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          
          mkdir -p $GITHUB_WORKSPACE/javatrap
          ln -sf "$JAVA_HOME/bin/javac" $GITHUB_WORKSPACE/javatrap/javac
          ln -sf "$JAVA_HOME/bin/java" $GITHUB_WORKSPACE/javatrap/java
          ln -sf "$JAVA_HOME/bin/jar" $GITHUB_WORKSPACE/javatrap/jar
          export PATH="$GITHUB_WORKSPACE/javatrap:$PATH"
          
          find . -type f -name "Makefile" -exec sed -i.bak "s|/usr/libexec/java_home -v 1.8|echo $JAVA_HOME|g" {} +
          find . -type f -name "Makefile" -exec sed -i.bak "s|/usr/libexec/java_home|echo $JAVA_HOME|g" {} +
          
          sed -i.bak '/You need to install JDK 8/d' Makefile
          
          # Dynamically find the Java source root and inject UI stubs directly beside the main packages
          for PL_FILE in $(find . -name "PojavLauncher.java"); do
            ROOT=$(dirname "$PL_FILE")/../../../..
            
            mkdir -p "$ROOT/com/apple/eawt"
            cat << 'EOF' > "$ROOT/com/apple/eawt/Application.java"
          package com.apple.eawt;
          public class Application {
              public static Application getApplication() { return new Application(); }
              public void setDockIconImage(java.awt.Image image) {}
              public void setDockIconBadge(String badge) {}
              public void requestToggleFullScreen(java.awt.Window window) {}
              public void requestForeground(boolean allWindows) {}
          }
          EOF
            
            mkdir -p "$ROOT/sun/font"
            cat << 'EOF' > "$ROOT/sun/font/FontUtilities.java"
          package sun.font;
          public class FontUtilities {
              public static boolean isWindows = false;
              public static boolean isMacOSX = false;
              public static boolean isLinux = false;
              public static boolean isSolaris = false;
          }
          EOF
          done
          
          export MAKE_ARGS="JAVA_HOME=$JAVA_HOME JAVAC=$JAVA_HOME/bin/javac JAVA=$JAVA_HOME/bin/java JAR=$JAVA_HOME/bin/jar JAVA_HOME_BIN=$JAVA_HOME/bin"
          
          # Parallel threads (-j) restored as the Java root is now fully resolved!
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} $MAKE_ARGS
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 $MAKE_ARGS
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 $MAKE_ARGS
          else
            make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} $MAKE_ARGS
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
